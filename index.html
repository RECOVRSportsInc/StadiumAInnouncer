<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StadiumAInnouncer</title>

  <style>
    :root {
      --bg: #07111f;
      --panel: #0f1b2d;
      --panel2: #17253a;
      --border: #2c3d55;
      --text: #f5f7fb;
      --muted: #9cabbd;
      --accent: #32d583;
      --accent-hover: #45e596;
      --danger: #ff5d68;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .header,
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .header {
      text-align: center;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 0;
      font-size: clamp(34px, 7vw, 56px);
    }

    .ai {
      color: var(--accent);
    }

    .tagline {
      margin-top: 8px;
      color: var(--muted);
    }

    .player-card {
      text-align: center;
    }

    .current-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .number {
      margin-top: 10px;
      font-size: clamp(64px, 15vw, 110px);
      font-weight: 900;
      line-height: 1;
    }

    .name {
      margin-top: 8px;
      font-size: clamp(34px, 8vw, 58px);
      font-weight: 900;
    }

    .position {
      margin-top: 10px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .sequence {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-top: 30px;
    }

    .chip {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
    }

    .arrow {
      color: var(--muted);
      font-size: 20px;
    }

    button {
      border: none;
      border-radius: 14px;
      min-height: 50px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .announce {
      width: 100%;
      min-height: 82px;
      margin-top: 30px;
      background: var(--accent);
      color: #04150d;
      font-size: 28px;
      font-weight: 900;
    }

    .announce:hover {
      background: var(--accent-hover);
    }

    .secondary {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .danger {
      width: 100%;
      margin-top: 12px;
      color: var(--danger);
      background: transparent;
      border: 1px solid var(--danger);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      background: var(--panel2);
      border-radius: 13px;
      color: var(--muted);
      min-height: 48px;
    }

    .status.error {
      color: var(--danger);
    }

    .history-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-time {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
      }

      .app {
        padding: 12px;
      }

      .header,
      .card {
        padding: 18px;
      }

      .chip {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <section class="header">
      <div class="eyebrow">The AI Voice of the Game</div>

      <h1>
        Stadium<span class="ai">AI</span>nnouncer
      </h1>

      <div class="tagline">
        Modular WAV Baseball Announcer
      </div>
    </section>


    <section class="card player-card">

      <div class="current-label">
        Current Batter
      </div>

      <div id="playerNumber" class="number">
        #1
      </div>

      <div id="playerName" class="name">
        John Smith
      </div>

      <div id="playerPosition" class="position">
        Left Fielder
      </div>


      <div id="sequence" class="sequence">
      </div>


      <button id="announceButton" class="announce" type="button">
        ANNOUNCE
      </button>


      <div class="row">

        <button id="previousButton" class="secondary" type="button">
          ← Previous
        </button>

        <button id="nextButton" class="secondary" type="button">
          Next Batter →
        </button>

      </div>


      <button id="stopButton" class="danger" type="button">
        STOP AUDIO
      </button>


      <div id="status" class="status">
        Ready
      </div>

    </section>


    <section class="card">

      <h2>Announcement History</h2>

      <div id="history">
        <div style="color:#9cabbd;">
          No announcements yet.
        </div>
      </div>

    </section>

  </main>


  <audio
    id="phraseAudio"
    preload="auto"
    src="audio/phrases/Now Batting For.wav">
  </audio>

  <audio
    id="teamAudio"
    preload="auto"
    src="audio/teams/McGill University.wav">
  </audio>

  <audio
    id="numberOneAudio"
    preload="auto"
    src="audio/numbers/Number One.wav">
  </audio>

  <audio
    id="leftFielderAudio"
    preload="auto"
    src="audio/positions/Left Fielder.wav">
  </audio>

  <audio
    id="johnSmithAudio"
    preload="auto"
    src="audio/players/John Smith.wav">
  </audio>


  <script>
    const players = [
      {
        number: "1",
        name: "John Smith",
        position: "Left Fielder",

        labels: [
          "Now batting for",
          "McGill University",
          "Number One",
          "Left Fielder",
          "John Smith"
        ],

        audioIds: [
          "phraseAudio",
          "teamAudio",
          "numberOneAudio",
          "leftFielderAudio",
          "johnSmithAudio"
        ]
      }
    ];


    const pauses = [
      55,
      85,
      70,
      95
    ];


    let currentIndex = 0;
    let playing = false;
    let history = [];
    let stopRequested = false;


    const playerNumber =
      document.getElementById("playerNumber");

    const playerName =
      document.getElementById("playerName");

    const playerPosition =
      document.getElementById("playerPosition");

    const sequence =
      document.getElementById("sequence");

    const announceButton =
      document.getElementById("announceButton");

    const previousButton =
      document.getElementById("previousButton");

    const nextButton =
      document.getElementById("nextButton");

    const stopButton =
      document.getElementById("stopButton");

    const status =
      document.getElementById("status");

    const historyElement =
      document.getElementById("history");


    function wait(milliseconds) {
      return new Promise(resolve => {
        setTimeout(resolve, milliseconds);
      });
    }


    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }


    function getCurrentPlayer() {
      return players[currentIndex];
    }


    function stopAllAudio() {

      stopRequested = true;

      players.forEach(player => {

        player.audioIds.forEach(id => {

          const audio =
            document.getElementById(id);

          if (audio) {
            audio.pause();
            audio.currentTime = 0;
          }

        });

      });

      playing = false;
      announceButton.disabled = false;

      setStatus("Stopped");
    }


    function playAudio(audio) {

      return new Promise((resolve, reject) => {

        audio.currentTime = 0;


        const handleEnded = () => {

          cleanup();

          resolve();

        };


        const handleError = () => {

          cleanup();

          reject(
            new Error(
              "Could not load: " +
              decodeURIComponent(
                audio.getAttribute("src")
              )
            )
          );

        };


        function cleanup() {

          audio.removeEventListener(
            "ended",
            handleEnded
          );

          audio.removeEventListener(
            "error",
            handleError
          );

        }


        audio.addEventListener(
          "ended",
          handleEnded
        );

        audio.addEventListener(
          "error",
          handleError
        );


        const result =
          audio.play();


        if (
          result &&
          typeof result.catch === "function"
        ) {

          result.catch(error => {

            cleanup();

            reject(error);

          });

        }

      });

    }


    async function announceCurrentPlayer() {

      if (playing) {
        return;
      }


      const player =
        getCurrentPlayer();


      playing = true;

      stopRequested = false;

      announceButton.disabled = true;

      setStatus("Announcing...");


      try {

        for (
          let index = 0;
          index < player.audioIds.length;
          index++
        ) {

          if (stopRequested) {
            return;
          }


          const audio =
            document.getElementById(
              player.audioIds[index]
            );


          if (!audio) {

            throw new Error(
              "Audio element missing."
            );

          }


          await playAudio(audio);


          if (
            index < pauses.length &&
            !stopRequested
          ) {

            await wait(
              pauses[index]
            );

          }

        }


        if (!stopRequested) {

          setStatus("Ready");

          addHistory(player);

        }

      }

      catch (error) {

        console.error(error);

        setStatus(
          error.message ||
          "Audio could not be played.",
          true
        );

      }

      finally {

        playing = false;

        announceButton.disabled = false;

      }

    }


    function renderPlayer() {

      const player =
        getCurrentPlayer();


      playerNumber.textContent =
        "#" + player.number;

      playerName.textContent =
        player.name;

      playerPosition.textContent =
        player.position;


      sequence.innerHTML = "";


      player.labels.forEach(
        (label, index) => {

          const chip =
            document.createElement("span");

          chip.className =
            "chip";

          chip.textContent =
            label;

          sequence.appendChild(chip);


          if (
            index <
            player.labels.length - 1
          ) {

            const arrow =
              document.createElement("span");

            arrow.className =
              "arrow";

            arrow.textContent =
              "→";

            sequence.appendChild(
              arrow
            );

          }

        }
      );

    }


    function addHistory(player) {

      history.unshift({

        time:
          new Date()
            .toLocaleTimeString(
              [],
              {
                hour: "numeric",
                minute: "2-digit"
              }
            ),

        text:
          "Now batting for McGill University, number " +
          player.number +
          ", " +
          player.position +
          ", " +
          player.name

      });


      history =
        history.slice(0, 20);


      renderHistory();

    }


    function renderHistory() {

      if (!history.length) {

        historyElement.innerHTML =
          '<div style="color:#9cabbd;">No announcements yet.</div>';

        return;

      }


      historyElement.innerHTML =
        history.map(item => {

          return `
            <div class="history-item">

              <div class="history-time">
                ${item.time}
              </div>

              <div>
                ${item.text}
              </div>

            </div>
          `;

        }).join("");

    }


    function goPrevious() {

      stopAllAudio();

      currentIndex--;


      if (currentIndex < 0) {

        currentIndex =
          players.length - 1;

      }


      renderPlayer();

      setStatus("Ready");

    }


    function goNext() {

      stopAllAudio();

      currentIndex++;


      if (
        currentIndex >=
        players.length
      ) {

        currentIndex = 0;

      }


      renderPlayer();

      setStatus("Ready");

    }


    announceButton.addEventListener(
      "click",
      announceCurrentPlayer
    );


    stopButton.addEventListener(
      "click",
      stopAllAudio
    );


    previousButton.addEventListener(
      "click",
      goPrevious
    );


    nextButton.addEventListener(
      "click",
      goNext
    );


    renderPlayer();
    renderHistory();

  </script>

</body>
</html>
