<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>StadiumAInnouncer</title>

  <style>
    :root {
      --bg: #07111f;
      --panel: #0f1b2d;
      --panel2: #17253a;
      --border: #2c3d55;
      --text: #f5f7fb;
      --muted: #9cabbd;
      --accent: #26d07c;
      --accent2: #31e18b;
      --danger: #ff5d68;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px;
    }

    .header,
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .ai {
      color: var(--accent);
    }

    .muted {
      color: var(--muted);
    }

    .player-card {
      text-align: center;
      padding: 24px 16px;
    }

    .label {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .number {
      font-size: 72px;
      font-weight: 900;
      margin-top: 10px;
    }

    .name {
      font-size: 38px;
      font-weight: 900;
      margin-top: 5px;
    }

    .position {
      margin-top: 10px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    button {
      border: none;
      border-radius: 14px;
      min-height: 48px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .announce {
      width: 100%;
      margin-top: 24px;
      min-height: 74px;
      font-size: 24px;
      background: var(--accent);
      color: #04150d;
    }

    .announce:hover {
      background: var(--accent2);
    }

    .secondary {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .row button {
      flex: 1;
    }

    .sequence {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 18px;
    }

    .chip {
      padding: 8px 12px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: var(--panel2);
      color: var(--muted);
      display: none;
    }

    .status.show {
      display: block;
    }

    .history-item {
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-time {
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .number {
        font-size: 56px;
      }

      .name {
        font-size: 30px;
      }

      .row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="header">
      <div class="label">The AI Voice of the Game</div>
      <h1>Stadium<span class="ai">AI</span>nnouncer</h1>
      <p class="muted">
        Modular WAV announcer prototype
      </p>
    </section>

    <section class="panel player-card">
      <div class="label">Current Batter</div>

      <div id="number" class="number">#1</div>
      <div id="name" class="name">John Smith</div>
      <div id="position" class="position">Left Fielder</div>

      <div id="sequence" class="sequence"></div>

      <button id="announce" class="announce">
        ANNOUNCE
      </button>

      <div class="row">
        <button id="previous" class="secondary">
          ← Previous
        </button>

        <button id="next" class="secondary">
          Next Batter →
        </button>
      </div>

      <button
        id="stop"
        class="danger"
        style="width:100%; margin-top:12px;"
      >
        STOP AUDIO
      </button>

      <div id="status" class="status"></div>
    </section>

    <section class="panel">
      <h2>Announcement History</h2>
      <div id="history" class="muted">
        No announcements yet.
      </div>
    </section>
  </main>

  <script>
    const players = [
      {
        number: "1",
        name: "John Smith",
        position: "Left Fielder",

        clips: [
          "audio/phrases/Now Batting For.wav",
          "audio/teams/McGill University.wav",
          "audio/numbers/Number One.wav",
          "audio/positions/The Left Fielder.wav",
          "audio/players/John Smith.wav"
        ],

        labels: [
          "Now batting for",
          "McGill University",
          "Number One",
          "The Left Fielder",
          "John Smith"
        ]
      }
    ];

    const pauses = [
      55,
      85,
      70,
      95
    ];

    let currentIndex = 0;
    let audioContext = null;
    let activeSources = [];
    let history = [];

    const bufferCache = new Map();

    const numberElement = document.getElementById("number");
    const nameElement = document.getElementById("name");
    const positionElement = document.getElementById("position");
    const sequenceElement = document.getElementById("sequence");
    const statusElement = document.getElementById("status");
    const historyElement = document.getElementById("history");

    function showStatus(message) {
      statusElement.textContent = message;
      statusElement.classList.add("show");

      clearTimeout(showStatus.timer);

      showStatus.timer = setTimeout(() => {
        statusElement.classList.remove("show");
      }, 3500);
    }

    function getAudioContext() {
      if (!audioContext) {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        audioContext = new AudioContextClass();
      }

      return audioContext;
    }

    async function loadBuffer(url) {
      if (bufferCache.has(url)) {
        return bufferCache.get(url);
      }

      const response = await fetch(
        encodeURI(url)
      );

      if (!response.ok) {
        throw new Error(
          "Could not load: " + url
        );
      }

      const arrayBuffer =
        await response.arrayBuffer();

      const context = getAudioContext();

      const audioBuffer =
        await context.decodeAudioData(
          arrayBuffer
        );

      bufferCache.set(
        url,
        audioBuffer
      );

      return audioBuffer;
    }

    function stopAudio() {
      activeSources.forEach(source => {
        try {
          source.stop();
        } catch (error) {}
      });

      activeSources = [];
    }

    async function playAnnouncement() {
      const player =
        players[currentIndex];

      if (!player) {
        return;
      }

      stopAudio();

      try {
        const context =
          getAudioContext();

        if (
          context.state ===
          "suspended"
        ) {
          await context.resume();
        }

        showStatus(
          "Loading announcement..."
        );

        const buffers =
          await Promise.all(
            player.clips.map(
              clip =>
                loadBuffer(clip)
            )
          );

        let startTime =
          context.currentTime +
          0.06;

        buffers.forEach(
          (buffer, index) => {
            const source =
              context.createBufferSource();

            source.buffer =
              buffer;

            source.connect(
              context.destination
            );

            source.start(
              startTime
            );

            activeSources.push(
              source
            );

            startTime +=
              buffer.duration;

            if (
              index <
              pauses.length
            ) {
              startTime +=
                pauses[index] /
                1000;
            }
          }
        );

        showStatus(
          "Playing announcement"
        );

        addHistory(player);

      } catch (error) {
        console.error(error);

        showStatus(
          error.message
        );
      }
    }

    function addHistory(player) {
      history.unshift({
        time:
          new Date()
            .toLocaleTimeString(
              [],
              {
                hour: "numeric",
                minute: "2-digit"
              }
            ),

        text:
          "Now batting for McGill University, number " +
          player.number +
          ", the " +
          player.position +
          ", " +
          player.name
      });

      renderHistory();
    }

    function renderHistory() {
      if (!history.length) {
        historyElement.textContent =
          "No announcements yet.";

        return;
      }

      historyElement.innerHTML =
        history.map(item => `
          <div class="history-item">
            <div class="history-time">
              ${item.time}
            </div>

            <div>
              ${item.text}
            </div>
          </div>
        `).join("");
    }

    function renderPlayer() {
      const player =
        players[currentIndex];

      numberElement.textContent =
        "#" + player.number;

      nameElement.textContent =
        player.name;

      positionElement.textContent =
        player.position;

      sequenceElement.innerHTML =
        "";

      player.labels.forEach(
        (label, index) => {

          const chip =
            document.createElement(
              "span"
            );

          chip.className =
            "chip";

          chip.textContent =
            label;

          sequenceElement.appendChild(
            chip
          );

          if (
            index <
            player.labels.length -
            1
          ) {

            const arrow =
              document.createElement(
                "span"
              );

            arrow.textContent =
              "→";

            sequenceElement.appendChild(
              arrow
            );
          }
        }
      );
    }

    async function preloadPlayer() {
      const player =
        players[currentIndex];

      try {
        await Promise.all(
          player.clips.map(
            clip =>
              loadBuffer(clip)
          )
        );

        showStatus(
          "Audio ready"
        );

      } catch (error) {
        console.error(error);

        showStatus(
          "Some WAV files are missing"
        );
      }
    }

    document
      .getElementById(
        "announce"
      )
      .addEventListener(
        "click",
        playAnnouncement
      );

    document
      .getElementById(
        "stop"
      )
      .addEventListener(
        "click",
        stopAudio
      );

    document
      .getElementById(
        "previous"
      )
      .addEventListener(
        "click",
        () => {

          currentIndex--;

          if (
            currentIndex < 0
          ) {
            currentIndex =
              players.length -
              1;
          }

          renderPlayer();
          preloadPlayer();
        }
      );

    document
      .getElementById(
        "next"
      )
      .addEventListener(
        "click",
        () => {

          currentIndex++;

          if (
            currentIndex >=
            players.length
          ) {
            currentIndex = 0;
          }

          renderPlayer();
          preloadPlayer();
        }
      );

    renderPlayer();

    window.addEventListener(
      "load",
      preloadPlayer
    );
  </script>
</body>
</html>
